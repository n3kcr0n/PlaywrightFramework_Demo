name: E2E Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Building
        run: echo "Building application..."

      - name: Build Complete
        run: echo "Build successful!"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploying
        run: echo "Deploying application to test environment..."

      - name: Deployment Complete
        run: echo "Deployment successful!"

  test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    env:
      QACART_URL: ${{ secrets.QACART_URL }}
      SAUCEDEMO_URL: ${{ secrets.SAUCEDEMO_URL }}
      SAUCEDEMO_USER_ENCRYPTED: ${{ secrets.SAUCEDEMO_USER_ENCRYPTED }}
      SAUCEDEMO_PASSWORD_ENCRYPTED: ${{ secrets.SAUCEDEMO_PASSWORD_ENCRYPTED }}
      CRYPTR_SECRET: ${{ secrets.CRYPTR_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        id: generate-allure
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            cp -R gh-pages/history allure-results/
          fi
          npx allure generate allure-results --clean --output allure-history

      - name: Deploy report to Github Pages
        if: always() && github.event_name != 'pull_request' && steps.generate-allure.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  notify:
    name: Email Allure Report
    runs-on: ubuntu-latest
    needs: [build, deploy, test]
    if: always()
    steps:
      - name: Send Allure Report Link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: Playwright E2E Test Report
          to: ${{ secrets.MAIL_TO }}
          from: Playwright E2E Automation
          body: |
            Your Playwright E2E pipeline has finished.
            Build status: ${{ needs.build.result }}
            Deploy status: ${{ needs.deploy.result }}
            Test and report job status: ${{ needs.test.result }}
            View the latest Allure Report:
            https://n3kcr0n.github.io/PlaywrightFramework_Demo/
            View the GitHub Actions run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}